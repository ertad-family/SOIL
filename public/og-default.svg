<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9943d"/>
      <stop offset="100%" style="stop-color:#e2b055"/>
    </linearGradient>
    <!-- Subtle glow effect -->
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#c9943d;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#c9943d;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Subtle glow -->
  <ellipse cx="600" cy="315" rx="400" ry="250" fill="url(#glowGradient)"/>

  <!-- Decorative Roman lines -->
  <line x1="200" y1="200" x2="1000" y2="200" stroke="url(#goldGradient)" stroke-width="1" opacity="0.3"/>
  <line x1="200" y1="430" x2="1000" y2="430" stroke="url(#goldGradient)" stroke-width="1" opacity="0.3"/>

  <!-- SOIL Text -->
  <text x="600" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="96" font-weight="600" fill="url(#goldGradient)">
    SOIL
  </text>

  <!-- Tagline -->
  <text x="600" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" fill="#94a3b8">
    Studies of Organizational Illness and Loss
  </text>

  <!-- Decorative dot -->
  <circle cx="600" cy="390" r="4" fill="#c9943d" opacity="0.5"/>

  <!-- Subtitle -->
  <text x="600" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#64748b" letter-spacing="0.3em">
    MEMENTO MORI
  </text>
</svg>
